services:
  next_app:
    image: next-app
    build:
      context: ./my-next-app/
      dockerfile: Dockerfile.dev  ### 開発用を読み込み ###
    container_name: next_app
    ports:
      - "3000:3000"
    volumes:
      - ./my-next-app:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma generate && npm run dev" # 開発専用 後で消す

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - next_app

  # PostgreSQLデータベースサービス
  db:
    image: postgres:15-alpine
    container_name: nextjs-prisma-postgres
    restart: always
    environment:
      # 環境変数: データベースの認証情報と初期設定
      POSTGRES_DATABASE: nextjs_db # 作成するデータベース名
      POSTGRES_USER: user # 作成する一般ユーザー名
      POSTGRES_PASSWORD: user_password # 一般ユーザーのパスワード
    ports:
      - "5432:5432" # ホスト(左)のポートをコンテナ(右)のポートにマッピング
    volumes:
      # データを永続化するためのボリューム
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: # データを永続化するボリュームの定義