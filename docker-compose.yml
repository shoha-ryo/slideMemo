services:
  next_app:
    build: .
    container_name: next_app
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - next_app
