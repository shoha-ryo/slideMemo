name: Code Quality and Tests on Pull Request

# ワークフローの目的や影響範囲、参考URLなどを数行で書く。
# このワークフローは、Pull Requestのオープン時および更新時にトリガーされ、
# 関連するコードの品質（Linter, Prettier）と機能（Unit Test）を自動的に検証します。
# 開発者がコードレビューに進む前に、基本的な問題を見つけるのに役立ちます。

on:
  # 動作確認しやすいように手動起動をサポート
  workflow_dispatch:
  # プルリクエストはファイルパスでフィルタリング (今回は主要なコード変更を対象とするためフィルタリングを緩和)
  pull_request:
    # types: [opened, synchronize, reopened] # デフォルトでこれらが含まれます
    paths-ignore:
      # ドキュメントや設定ファイルなどの変更ではテストをスキップすることが多いです
      - '**.md'
      - 'LICENSE'
      - '.github/**' # ワークフロー自体は除外

# ワークフローレベルでパーミッションをすべて無効化
permissions: {}

# デフォルトシェルでパイプエラーを有効化
defaults:
  run:
    shell: bash

# ワークフローが複数起動したら自動キャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 依存関係のインストール、テスト、Linter、Prettierを実行するジョブ
  # =========================================================
  test_and_lint:
    # もっとも安価なUbuntuランナーを利用
    runs-on: ubuntu-latest
    # 6時間も待たされないようにタイムアウトを設定
    timeout-minutes: 10 # テスト時間に応じて調整してください

    defaults:
      run:
        working-directory: my-next-app

    # ジョブレベルで必要最小限のパーミッションを定義
    permissions:
      contents: read

    steps:
      # ----------------------------------------------------
      # 1. リポジトリのチェックアウト
      # ----------------------------------------------------
      # アクションはコミットハッシュで固定 (ご提示のアクションをそのまま使用)
      - name: Checkout Repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # ----------------------------------------------------
      # 2. Node.jsのセットアップ
      # ----------------------------------------------------
      - name: Set up Node.js
        # Node.jsバージョンはプロジェクトに合わせて変更してください
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.0
        with:
          node-version: '23.5.0'
          # キャッシュを利用して依存関係のインストール時間を短縮
          cache: 'npm' # 使用しているパッケージマネージャに合わせて 'yarn', 'pnpm' などに変更

      # ----------------------------------------------------
      # 3. 依存関係のインストール
      # ----------------------------------------------------
      - name: Install Dependencies
        run: npm Install

      # ----------------------------------------------------
      # 4. テストの実行 (Unit/Integration Test)
      # ----------------------------------------------------
      - name: Run Tests
        run: npm run test

      # ----------------------------------------------------
      # 5. Linterの実行
      # ----------------------------------------------------
      - name: Run Linter (ESLint/TSLint etc.)
        run: npm run lint